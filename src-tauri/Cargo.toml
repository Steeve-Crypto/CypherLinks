[package]
name = "cypherlinks"
version = "0.1.0"
description = "Local-first desktop media downloader"
authors = ["CypherLinks"]
edition = "2021"

[lib]
name = "cypherlinks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "net"] }
regex = "1"
dirs = "6"
which = "8"

tauri-plugin-updater = "2"
tauri-plugin-process = "2"
