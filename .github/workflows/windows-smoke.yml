name: Windows desktop smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check
      - name: Build desktop executable
        run: npm run tauri build -- --debug --no-bundle
      - name: Launch Windows smoke test
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
